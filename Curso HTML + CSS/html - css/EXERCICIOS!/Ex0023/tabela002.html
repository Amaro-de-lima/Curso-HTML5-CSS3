<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table{
            border-collapse: collapse;
            width: 500px;
        }

        tr{
            
        }

        td, th{
            border: 1px solid black;
            padding: 10px;
        }

        .vendas{
            text-align: right;
        }
    </style>
    <title>Tabelas Grandes</title>
</head>
<body>
    <table>
        <caption>Jogos mais vendidos da historia</caption>
        <thead>
            <tr>
                <th>Titulo</th>
                <th>Vendas</th>
                <th>Plataformas</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Minecraft</td>
                <td class="vendas">300.000.000</td>
                <td>Multi-Plataforma</td>
            </tr>

            <tr>
                <td>GTA 5</td>
                <td class="vendas">205.000.000</td>
                <td>Multi-Plataforma</td>
            </tr>

            <tr>
                <td>Tetris</td>
                <td class="vendas">100.000.000</td>
                <td>Multi-Plataforma</td>
            </tr>

            <tr>
                <td>Wii Sports</td>
                <td class="vendas">82.900.000</td>
                <td>Multi-Plataforma</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
