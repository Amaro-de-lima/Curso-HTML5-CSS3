<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira Tabela no HTML5</title>
    <style>
        table{
            text-align: center;
            border-collapse: collapse;
        }
        
        tr {
            color: blue;
           
        }

        td{
            border: 1px solid;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Melhores jogos.</h1>
    <table>
        <tr>
            <td>PC</td>
            <td>PS2</td>
            <td>Mobile</td>
        </tr>
        <tr>
            <td>Dark Souls 2</td>
            <td>God of war 2</td>
            <td>Clash of Clans</td>
        </tr>
    </table>
</body>
</html>
