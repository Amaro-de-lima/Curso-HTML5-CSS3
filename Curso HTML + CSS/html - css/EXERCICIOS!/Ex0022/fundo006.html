<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização vertical</title>
    <style>
    #con{
        background-color: blueviolet;
        height: 500px;

        position: relative;
    }
    
    #tan{
        background-color: black;
        height: 100px;
        width: 100px;

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    </style>
</head>
<body>
    <section id="con">
        <article id="tan">

        </article>
    </section>
</body>
</html>
